name: Check before merge to dev or main

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    name: Run Lint, Prettier, Stylelint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.11

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - name: Install dependencies
        run: pnpm i

      - name: Install missing dependency
        run: pnpm i @typescript-eslint/types -D

      - name: Run Prettier, ESLint, Stylelint
        run: pnpm check

      - name: Build project
        run: pnpm build
